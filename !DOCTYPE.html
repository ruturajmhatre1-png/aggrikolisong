<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>आगरी कोळी गीत | Aagri Koli Songs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Poppins", sans-serif;
    color: #fff;
    overflow-x: hidden;
    background: #071c3d;
}


/* =====================================================
   VARIABLES
===================================================== */

:root {

    --blue-dark: #061a3d;
    --blue: #0077be;
    --blue-light: #21b5e7;

    --orange: #ff5b45;
    --yellow: #ffd83d;

    --white: #ffffff;

    --glass: rgba(255,255,255,0.12);

    --border: rgba(255,255,255,0.22);

    --shadow:
        0 20px 60px rgba(0,0,0,0.35);
}


/* =====================================================
   BACKGROUND
===================================================== */

.page {

    position: relative;

    min-height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #04132e 0%,
            #082b5b 25%,
            #0077be 60%,
            #ff784f 100%
        );
}


/* =====================================================
   SUN
===================================================== */

.sun {

    position: absolute;

    width: 260px;
    height: 260px;

    right: 8%;
    top: 5%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbd0 0%,
            #ffe66d 35%,
            #ffb52e 65%,
            transparent 72%
        );

    box-shadow:
        0 0 80px rgba(255,195,40,0.7);

    opacity: 0.9;

    z-index: 1;
}


/* =====================================================
   STARS
===================================================== */

.stars {

    position: absolute;

    inset: 0;

    opacity: 0.35;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size: 75px 75px;

    z-index: 1;

    pointer-events: none;
}


/* =====================================================
   GLOW
===================================================== */

.glow {

    position: absolute;

    width: 500px;
    height: 500px;

    left: -250px;
    top: 30%;

    border-radius: 50%;

    background:
        rgba(0,170,255,0.25);

    filter: blur(80px);

    z-index: 1;
}


/* =====================================================
   MAIN
===================================================== */

.content {

    position: relative;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        30px
        30px
        190px;

    z-index: 10;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    font-family: "Kalam", cursive;

    font-size:
        clamp(
            52px,
            9vw,
            105px
        );

    line-height: 0.95;

    font-weight: 700;

    letter-spacing: 3px;

    background:
        linear-gradient(
            180deg,
            #ffffff 10%,
            #fff9b0 50%,
            #ffd426 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(
            5px 5px 0 #ff5545
        )
        drop-shadow(
            10px 15px 25px
            rgba(0,0,0,0.4)
        );

    animation:
        titleFloat 4s ease-in-out infinite;
}


.subtitle {

    margin-top: 18px;

    font-size: 13px;

    letter-spacing: 9px;

    font-weight: 600;

    opacity: 0.85;
}


/* =====================================================
   BOAT
===================================================== */

.boat {

    width: 360px;

    max-width: 75vw;

    margin-top: 20px;

    cursor: pointer;

    animation:
        boatFloat 4s ease-in-out infinite;

    transition:
        transform 0.3s ease;

    filter:
        drop-shadow(
            0 25px 20px
            rgba(0,0,0,0.4)
        );
}

.boat:hover {

    transform:
        scale(1.08)
        rotate(-2deg);
}

.boat svg {

    width: 100%;

    display: block;
}


/* =====================================================
   QUOTE
===================================================== */

.quote {

    min-height: 48px;

    margin-top: 5px;

    font-family: "Kalam", cursive;

    font-size:
        clamp(
            21px,
            3vw,
            31px
        );

    text-shadow:
        0 0 15px
        rgba(255,255,255,0.9);

    transition:
        opacity 0.5s ease;
}


/* =====================================================
   OCEAN
===================================================== */

.ocean {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 180px;

    z-index: 3;

    pointer-events: none;
}

.wave {

    position: absolute;

    left: -10%;

    bottom: -100px;

    width: 120%;

    height: 190px;

    border-radius:
        50% 50% 0 0;

    background:
        rgba(0,65,125,0.88);

    animation:
        wave 8s ease-in-out infinite;
}

.wave.two {

    bottom: -125px;

    opacity: 0.65;

    animation-duration: 11s;

    animation-direction: reverse;
}

.wave.three {

    bottom: -150px;

    opacity: 0.35;

    animation-duration: 14s;
}


/* =====================================================
   PLAYER
===================================================== */

.player {

    position: fixed;

    left: 50%;
    bottom: 22px;

    transform:
        translateX(-50%);

    width: min(94%, 850px);

    padding: 20px 25px;

    border:
        1px solid
        var(--border);

    border-radius: 28px;

    background:
        rgba(10,30,60,0.55);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        var(--shadow);

    z-index: 100;
}


/* =====================================================
   PLAYER HEADER
===================================================== */

.player-header {

    display: flex;

    align-items: center;

    gap: 15px;
}


/* =====================================================
   MUSIC ICON
===================================================== */

.music-icon {

    flex-shrink: 0;

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 25px;

    color: #111;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffd72e
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.3);
}


/* =====================================================
   TRACK INFO
===================================================== */

.track-info {

    flex: 1;

    min-width: 0;

    text-align: left;
}

.track-title {

    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.track-status {

    font-size: 10px;

    opacity: 0.65;

    margin-top: 4px;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    align-items: center;

    gap: 10px;
}

.control {

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    color: #fff;

    background:
        rgba(255,255,255,0.1);

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}

.control:hover {

    background:
        rgba(255,255,255,0.25);

    transform: scale(1.08);
}


.play {

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #fff;

    color: #111;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.35);

    transition: 0.2s;
}

.play:hover {

    transform: scale(1.08);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-box {

    width: 100%;

    height: 6px;

    margin-top: 17px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.18);

    overflow: hidden;

    cursor: pointer;
}

.progress {

    width: 0%;

    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            var(--orange),
            var(--yellow)
        );
}


/* =====================================================
   TIME
===================================================== */

.time {

    display: flex;

    justify-content:
        space-between;

    font-size: 9px;

    opacity: 0.6;

    margin-top: 5px;
}


/* =====================================================
   VOLUME
===================================================== */

.volume-box {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    margin-top: 9px;
}

.volume-box span {

    font-size: 14px;
}

.volume {

    width: 110px;

    accent-color:
        var(--yellow);

    cursor: pointer;
}


/* =====================================================
   BADGE
===================================================== */

.badge {

    position: absolute;

    top: 13px;
    right: 18px;

    padding:
        3px 7px;

    border:
        1px solid
        var(--yellow);

    border-radius: 5px;

    color:
        var(--yellow);

    font-size: 8px;

    letter-spacing: 1px;
}


/* =====================================================
   YOUTUBE
===================================================== */

#youtube-player {

    position: fixed;

    width: 1px;
    height: 1px;

    left: -20px;
    bottom: 0;

    opacity: 0.01;

    pointer-events: none;
}


/* =====================================================
   FISH
===================================================== */

.fish {

    position: fixed;

    z-index: 9999;

    pointer-events: none;

    font-size: 28px;

    animation:
        fish 2s ease-out forwards;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes titleFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-8px);
    }
}


@keyframes boatFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(2deg);
    }
}


@keyframes wave {

    0% {
        transform:
            translateX(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateX(-3%)
            rotate(1deg);
    }

    100% {
        transform:
            translateX(-8%)
            rotate(0deg);
    }
}


@keyframes fish {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(1)
            rotate(0deg);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0)
            rotate(360deg);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 650px) {

    .content {

        justify-content:
            flex-start;

        padding-top: 75px;

        padding-bottom: 185px;
    }

    .title {

        font-size: 52px;

        letter-spacing: 0;
    }

    .subtitle {

        font-size: 8px;

        letter-spacing: 4px;
    }

    .boat {

        width: 245px;

        margin-top: 25px;
    }

    .quote {

        font-size: 20px;
    }

    .player {

        bottom: 10px;

        padding:
            16px 14px;

        border-radius: 22px;
    }

    .badge {

        display: none;
    }

    .music-icon {

        width: 42px;
        height: 42px;

        font-size: 19px;
    }

    .track-title {

        font-size: 11px;
    }

    .track-status {

        font-size: 8px;
    }

    .control {

        width: 34px;
        height: 34px;

        font-size: 13px;
    }

    .play {

        width: 45px;
        height: 45px;

        font-size: 18px;
    }

    .controls {

        gap: 5px;
    }

    .volume {

        width: 90px;
    }

    .sun {

        width: 180px;
        height: 180px;

        right: -70px;
        top: 8%;
    }

}

</style>
</head>


<body>

<div class="page">


    <!-- BACKGROUND -->

    <div class="stars"></div>

    <div class="sun"></div>

    <div class="glow"></div>


    <!-- YOUTUBE PLAYER -->

    <div id="youtube-player"></div>


    <!-- MAIN -->

    <main class="content">


        <h1 class="title">
            आगरी कोळी गीत
        </h1>


        <div class="subtitle">

        </div>


        <!-- BOAT -->

        <div
            class="boat"
            onclick="spawnFish(event)"

            <svg

    <section class="player">

                    class="track-title"

                >

</div>


<script>

/* =====================================================
   PLAYLIST SETTINGS
===================================================== */

const PLAYLIST_ID =
    "PLZsQp3SkI_og";


let player = null;

let playerReady = false;

let progressInterval = null;


/* =====================================================
   LOAD YOUTUBE API
===================================================== */

const tag =
    document.createElement("script");

tag.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "1",

                height: "1",

                playerVars: {

                    listType:
                        "playlist",

                    list:
                        PLAYLIST_ID,

                    autoplay: 0,

                    controls: 0,

                    playsinline: 1,

                    rel: 0,

                    modestbranding: 1

                },

                events: {

                    onReady:
                        playerReadyEvent,

                    onStateChange:
                        playerStateChange,

                    onError:
                        playerError

                }

            }
        );

}


/* =====================================================
   PLAYER READY
===================================================== */

function playerReadyEvent() {

    playerReady = true;

    player.setVolume(80);

    document.getElementById(
        "track-status"
    ).innerText =
        "आगरी कोळी Playlist तयार आहे";

}


/* =====================================================
   PLAYER STATE
===================================================== */

function playerStateChange(event) {

    const playButton =
        document.getElementById(
            "play-button"
        );

    const status =
        document.getElementById(
            "track-status"
        );


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        playButton.innerText = "⏸";

        status.innerText =
            "♪ गाणे सुरू आहे";

        startProgress();

        updateTitle();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        playButton.innerText = "▶";

        status.innerText =
            "गाणे Pause केले";

        stopProgress();

    }


    else if (
        event.data ===
        YT.PlayerState.BUFFERING
    ) {

        status.innerText =
            "गाणे Loading...";

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        playButton.innerText = "▶";

        stopProgress();

    }

}


/* =====================================================
   UPDATE SONG TITLE
===================================================== */

function updateTitle() {

    if (!playerReady)
        return;

    try {

        const data =
            player.getVideoData();

        if (
            data &&
            data.title
        ) {

            document.getElementById(
                "track-title"
            ).innerText =
                data.title;

        }

    }

    catch(error) {

        console.log(error);

    }

}


/* =====================================================
   ERROR
===================================================== */

function playerError(event) {

    console.log(
        "YouTube Player Error:",
        event.data
    );

    document.getElementById(
        "track-status"
    ).innerText =
        "हे गाणे embed करता येत नाही";

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay() {

    if (!playerReady) {

        document.getElementById(
            "track-status"
        ).innerText =
            "Playlist Loading...";

        return;

    }


    const state =
        player.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    }

    else {

        player.playVideo();

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextVideo() {

    if (!playerReady)
        return;

    player.nextVideo();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousVideo() {

    if (!playerReady)
        return;

    player.previousVideo();

}


/* =====================================================
   PROGRESS START
===================================================== */

function startProgress() {

    stopProgress();

    updateProgress();

    progressInterval =
        setInterval(
            updateProgress,
            500
        );

}


/* =====================================================
   PROGRESS STOP
===================================================== */

function stopProgress() {

    if (
        progressInterval !== null
    ) {

        clearInterval(
            progressInterval
        );

        progressInterval = null;

    }

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress() {

    if (
        !playerReady
    ) {
        return;
    }


    try {

        const duration =
            player.getDuration();

        const current =
            player.getCurrentTime();


        if (
            duration &&
            duration > 0
        ) {

            const percentage =
                (
                    current /
                    duration
                ) * 100;


            document.getElementById(
                "progress"
            ).style.width =
                percentage + "%";


            document.getElementById(
                "current-time"
            ).innerText =
                formatTime(current);


            document.getElementById(
                "total-time"
            ).innerText =
                formatTime(duration);

        }

    }

    catch(error) {

        console.log(error);

    }

}


/* =====================================================
   SEEK
===================================================== */

document.getElementById(
    "progress-box"
).addEventListener(
    "click",
    function(event) {

        if (!playerReady)
            return;


        const rectangle =
            this.getBoundingClientRect();


        const clickPosition =
            event.clientX -
            rectangle.left;


        const percentage =
            clickPosition /
            rectangle.width;


        const duration =
            player.getDuration();


        if (
            duration > 0
        ) {

            player.seekTo(
                duration *
                percentage,
                true
            );

        }

    }
);


/* =====================================================
   VOLUME
===================================================== */

document.getElementById(
    "volume"
).addEventListener(
    "input",
    function() {

        if (!playerReady)
            return;


        player.setVolume(
            Number(this.value)
        );

    }
);


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsLeft =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(secondsLeft)
            .padStart(2,"0")
    );

}


/* =====================================================
   MARATHI QUOTES
===================================================== */

const quotes = [

    "वेसावची पारू नेसायली लुगडी...",

    "माज्या गोमूचा सोन्याचा मणी...",

    "कोलीवाडा झिम्माड हायलाय...",

    "डोंगराचा राजा माझा एकविरा आई...",

    "पापलेट वाला आला रे!",

    "गोमू माहेरला जाते हो नाखवा...",

    "मना कोलीवाडा ह्यो भारी दिसता..."

];


let quoteIndex = 0;


setInterval(
    function() {

        const element =
            document.getElementById(
                "quote"
            );


        element.style.opacity = "0";


        setTimeout(
            function() {

                quoteIndex++;

                if (
                    quoteIndex >=
                    quotes.length
                ) {

                    quoteIndex = 0;

                }


                element.innerText =
                    quotes[
                        quoteIndex
                    ];


                element.style.opacity = "1";

            },
            500
        );

    },
    4000
);


/* =====================================================
   FISH EFFECT
===================================================== */

function spawnFish(event) {

    const fishList = [

        "🐟",
        "🐠",
        "🐡",
        "🦐",
        "🦀"

    ];


    const fish =
        document.createElement(
            "div"
        );


    fish.className =
        "fish";


    fish.innerText =
        fishList[
            Math.floor(
                Math.random() *
                fishList.length
            )
        ];


    fish.style.left =
        event.clientX + "px";


    fish.style.top =
        event.clientY + "px";


    const x =
        (
            Math.random() -
            0.5
        ) * 500;


    const y =
        (
            Math.random() -
            0.5
        ) * 400;


    fish.style.setProperty(
        "--x",
        x + "px"
    );


    fish.style.setProperty(
        "--y",
        y + "px"
    );


    document.body.appendChild(
        fish
    );


    setTimeout(
        function() {

            fish.remove();

        },
        2000
    );

}


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        /* SPACE */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        /* RIGHT ARROW */

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextVideo();

        }


        /* LEFT ARROW */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousVideo();

        }


        /* FISH */

        if (
            event.key.toLowerCase()
            === "f"
        ) {

            spawnFish({

                clientX:
                    window.innerWidth / 2,

                clientY:
                    window.innerHeight / 2

            });

        }

    }
);

</script>
